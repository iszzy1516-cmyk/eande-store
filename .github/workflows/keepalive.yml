name: keep-alive

# Ping the Render health endpoint every 10 minutes so the free instance
# never idles into sleep (cold starts feel broken for a shop checkout).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        run: curl -sf --max-time 30 "https://eande-api.onrender.com/api/health" || exit 0
